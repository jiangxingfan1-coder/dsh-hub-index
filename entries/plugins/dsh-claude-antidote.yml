securityNotes: 安全教材：证明插件可静默覆盖另一插件的行为而保留其 UI 假象（bundle patch + host hooks +
  client slots）。装它=明知禁用风控；更大的含义是任何插件都可能被同类手法覆盖——审计需看全组合树。
