<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-hub — DeepSeek Harness 生态索引</title>
<style>
  :root { --fg:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --bg:#fff; --chip:#f3f4f6; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e5e7eb; --muted:#9ca3af; --line:#374151; --bg:#111827; --chip:#1f2937; } }
  * { box-sizing: border-box; }
  body { margin:0 auto; max-width:860px; padding:2.5rem 1.25rem 4rem; font:16px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--fg); background:var(--bg); }
  h1 { font-size:1.6rem; margin:0 0 .25rem; }
  .sub { color:var(--muted); margin:0 0 1.5rem; }
  input { width:100%; padding:.6rem .9rem; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); margin-bottom:1.25rem; }
  .card { border:1px solid var(--line); border-radius:10px; padding:.9rem 1.1rem; margin-bottom:.75rem; }
  .row { display:flex; gap:.5rem; align-items:baseline; flex-wrap:wrap; }
  .name { font-weight:600; font-size:1.05rem; }
  .chip { font-size:.75rem; padding:.1rem .55rem; border-radius:99px; background:var(--chip); color:var(--muted); }
  .trust-official { background:#dbeafe; color:#1d4ed8; }
  .trust-verified { background:#dcfce7; color:#15803d; }
  .trust-community { background:#fef9c3; color:#a16207; }
  .trust-unreviewed { background:#fee2e2; color:#b91c1c; }
  .desc { margin:.35rem 0 .4rem; color:var(--fg); }
  .meta { font-size:.85rem; color:var(--muted); }
  .meta a { color:inherit; }
  .warn { border:1px solid var(--line); border-radius:10px; padding:.8rem 1.1rem; margin:0 0 1.25rem; font-size:.9rem; color:var(--muted); }
  code { background:var(--chip); padding:.1rem .35rem; border-radius:5px; font-size:.88em; }
  footer { margin-top:2.5rem; font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
<h1>dsh-hub</h1>
<p class="sub">DeepSeek Harness 生态的发现与信任索引 — 插件 · 技能 · 组合（compose）</p>
<div class="warn">⚠️ 装一个 dsh 插件 = npm postinstall + Host realm 零审批 = 交出整台机器。<b>unreviewed</b> 条目请读源码后再装。下载量与排名不参与信任评级（可操纵信号）。</div>
<input id="q" type="search" placeholder="搜索名称 / 描述…" autocomplete="off">
<div id="list">加载中…</div>
<footer>信任分层：official（官方域）→ verified（实名+溯源核验）→ community（实名无审计）→ unreviewed（默认档）。提交条目见 <a href="https://github.com/jiangxingfan1-coder/dsh-hub-index">仓库 README</a>。</footer>
<script>
const TRUST = { official:'trust-official', verified:'trust-verified', community:'trust-community', unreviewed:'trust-unreviewed' }
let DATA = []
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }
function render(q){
  q = (q||'').toLowerCase()
  const hits = DATA.filter(e => !q || (e.name+' '+e.description).toLowerCase().includes(q))
  document.getElementById('list').innerHTML = hits.map(e => `
    <div class="card">
      <div class="row">
        <span class="name">${esc(e.name)}</span>
        <span class="chip">${esc(e.kind)}</span>
        <span class="chip ${TRUST[e.trust]||''}">${esc(e.trust)}</span>
        ${e.security?.jsExpressions ? '<span class="chip trust-unreviewed" title="patch/preset 含 !!js 表达式（任意代码）">!!js</span>' : ''}
      </div>
      <div class="desc">${esc(e.description)}</div>
      <div class="meta">
        ${e.install ? `安装：<code>${esc(e.install.startsWith('dsh ')?e.install:`dsh plugin add ${e.install}`)}</code> · ` : ''}
        ${e.source?.repo ? `<a href="${esc(e.source.repo)}">仓库</a> · ` : ''}
        ${e.source?.npm ? `<a href="${esc(e.source.npm)}">npm</a> · ` : ''}
        ${e.source?.discussion ? `<a href="${esc(e.source.discussion)}">discussion</a> · ` : ''}
        <a href="https://github.com/jiangxingfan1-coder/dsh-hub-index/blob/main/${esc(e._file)}">条目源</a>
      </div>
    </div>`).join('') || '<p class="meta">无匹配条目</p>'
}
fetch('entries.json').then(r=>r.json()).then(d=>{ DATA=d.entries; render('') })
document.getElementById('q').addEventListener('input', e=>render(e.target.value))
</script>
</body>
</html>
